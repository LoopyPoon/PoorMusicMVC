<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>PoorMusic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous"
    >
    <script>
        function addTrackForm() {
            const trackFormsDiv = document.getElementById("trackForms");
            const trackIndex = trackFormsDiv.childElementCount;
            const newTrackForm = document.createElement("div");
            newTrackForm.classList.add("track");

            newTrackForm.innerHTML = `
                <h4>Track ${trackIndex + 1}</h4>
                <label for="trackTitle${trackIndex}">Track Title:</label>
                <input type="text" id="trackTitle${trackIndex}" name="tracks[${trackIndex}].title" required>
                <label for="trackDuration${trackIndex}">Duration:</label>
                <input type="number" step="0.01" id="trackDuration${trackIndex}" name="tracks[${trackIndex}].duration" required>
                <label for="trackArtists${trackIndex}">Artists:</label>
                <input type="text" id="trackArtists${trackIndex}" name="tracks[${trackIndex}].artists" required>
            `;
            trackFormsDiv.appendChild(newTrackForm);
        }
    </script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/index}">PoorMusic</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/login}">Login</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/register}">Register</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/playlists}">Collections</a>
                </li>
        </div>
    </div>
</nav>

<form th:action="@{/admin/saveAlbum}" th:object="${album}" method="POST">
    <div class="d-flex flex-column p-4 gap-4 py-md-5">
        <div>
            <h1>Add New Album</h1>
        </div>
        <div>
                <label for="title">Album Title:</label>
                <input type="text" id="title" th:field="*{title}" class="form-control col-4 mb-4" placeholder="Enter Title" required />

                <label for="year">Album Year:</label>
                <input type="number" id="year" th:field="*{year}" class="form-control col-4 mb-4" placeholder="Enter Year" required />

                <label for="genre">Album Genre:</label>
                <input type="text" id="genre" th:field="*{genre}" class="form-control col-4 mb-4" placeholder="Enter Genre" required />

                <label for="artists">Artists (comma separated):</label>
                <input type="text" id="artists" th:field="*{artists}" class="form-control col-4 mb-4" placeholder="Artist1,Artist2,..." required />

                <button type="submit" class="btn btn-primary col-2">Save Album</button>
        </div>
    </div>

    <h3>Tracks</h3>
    <div id="trackForms">
        <div class="track">
            <label for="trackTitle0">Track Title:</label>
            <input type="text" id="trackTitle0" name="tracks[0].title" required>
            <label for="trackDuration0">Duration:</label>
            <input type="number" step="0.01" id="trackDuration0" name="tracks[0].duration" required>
            <label for="trackArtists0">Artists:</label>
            <input type="text" id="trackArtists0" name="tracks[0].artists" required>
        </div>
    </div>
    <button type="button" onclick="addTrackForm()">Add Another Track</button>
    <br>
</form>
