<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>PoorMusic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous"
    >
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/index}">PoorMusic</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/login}">Login</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/register}">Register</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/playlists}">Playlists</a>
                </li>
        </div>
    </div>
</nav>
<div class="d-flex flex-column p-4 gap-4 py-md-5">
    <div>
        <h3>Add New Track</h3>
    </div>
    <form th:action="@{/saveTrack}" th:object="${track}" method="post">
        <div>
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" th:field="*{title}" required/>
        </div>
        <div>
            <label for="album">Album:</label>
            <input type="text" id="album" name="album" th:field="*{album.title}" required/>
        </div>
        <div>
            <label for="artists">Artists:</label>
            <input type="text" id="artists" name="artists" th:field="*{artists}" placeholder="Enter artist names separated by commas" required/>
        </div>
        <div>
            <label for="duration">Duration:</label>
            <input type="number" step="0.01" id="duration" name="duration" th:field="*{duration}" required/>
        </div>
        <div>
            <button type="submit">Add Track</button>
        </div>
    </form>
<!--    <div>-->
<!--        <form th:action="@{/saveTrack}" th:object="${track}" method="POST">-->
<!--            <input type="text" th:field="*{title}" class="form-control col-4 mb-4" placeholder="Enter Title"/>-->
<!--            <button type="submit" class="btn btn-primary col-2">Save</button>-->
<!--            <input type="hidden" th:field="*{id}"/>-->
<!--        </form>-->
<!--    </div>-->
</div>

</body>
</html>
