<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <title>PoorMusic</title>
    <th:block th:insert="~{styles :: styles}"></th:block>
    <th:block th:insert="~{scripts :: scripts}"></th:block>
</head>
<body>
<header>
    <th:block th:insert="~{navbar :: navbar}"></th:block>
</header>
    <main>
        <section class="py-5 text-center container">
            <div class="row py-lg-5">
                <div class="col-lg-6 col-md-8 mx-auto">
                    <h1 class="fw-light">Collection</h1>
                    <p class="lead text-body-secondary">Something short and leading about the collection below—its contents, the creator, etc. Make it short and sweet, but not too short so folks don’t simply skip over it entirely.</p>
                </div>
            </div>
        </section>
        <div class="container">
            <ul class="nav nav-pills nav-justified">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/searchTracks}" th:text="${#lists.size(trackPage.content)} + ' tracks'">tracks</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/searchAlbums}" th:text="${#lists.size(trackPage.content)} + ' albums'">albums</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/searchArtists}" th:text="${#lists.size(trackPage.content)} + ' artists'">artists</a>
                </li>
            </ul>
        </div>

        <div class="d-flex-grow-1 flex-column flex-md-row p-4 gap-4 py-md-3 align-items-center justify-content-center">
            <div class="list-group">
                <div class="list-group-item list-group-item-action d-flex gap-3 py-3" aria-current="true" th:each="track : ${trackPage.content}">
                    <div class="flex-content me-auto">
                        <img src="https://avatars.yandex.net/get-music-content/5576540/6cb4a916.a.21564373-1/50x50" alt="twbs" width="50" height="50" class="rounded-circle flex-shrink-0">
                    </div>
                    <div class="d-flex-grow-2 gap-2 w-100 justify-content-start">
                        <div>
                            <h6 class="mb-0">
                                <a th:href="@{'/track/' + ${track.album.id}}" th:text="${track.title}"></a>
                            </h6>
                            <p class="mb-0 opacity-75">
                        <span th:each="artist, artistStat : ${track.artists}">
                            <a th:href="@{'/artist/' + ${artist.id}}" th:text="${artist.title}"></a>
                            <span th:if="${!artistStat.last}">, </span>
                        </span>
                            </p>
                        </div>
                    </div>
                    <div class="flex-content ms-auto">
                        <small class="opacity-50 text-nowrap" th:text="${track.duration}"></small>
                    </div>
                </div>
            </div>
        </div>
        <ul>
            <li th:each="track : ${trackPage.content}">
                <span th:text="${track}">Track Title</span>
                <ul>
                    <li th:each="artist : ${track.artists}">
                        <span th:text="${artist}">Artist Name</span>
                    </li>
                </ul>
                <span th:text="${track}">Track Name</span>
            </li>
        </ul>

        <div>
            <a th:if="${trackPage.hasPrevious()}"
               th:href="@{/search(query=${name}, page=${currentPage - 1}, size=${trackPage.size})}">Previous</a>

            <span th:text="${currentPage + 1}">1</span> / <span th:text="${trackPage.totalPages}">1</span>

            <a th:if="${trackPage.hasNext()}"
               th:href="@{/search(query=${name}, page=${currentPage + 1}, size=${trackPage.size})}">Next</a>
        </div>
    </main>

</body>
</html>
