<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <title>PoorMusic</title>
    <th:block th:insert="~{styles :: styles}"></th:block>
    <th:block th:insert="~{scripts :: scripts}"></th:block>
</head>
<body>
    <header>
        <th:block th:insert="~{navbar :: navbar}"></th:block>
    </header>
    <main>
        <div class="d-flex flex-column p-4 gap-4 py-md-5">
            <div>
                <h3>Add New Playlist</h3>
            </div>
            <div>
                <form th:action="@{/savePlaylist}" th:object="${playlist}" method="POST">
                    <input type="text" th:field="*{title}" class="form-control col-4 mb-4" placeholder="Enter Title"/>
                    <button type="submit" class="btn btn-primary col-2">Save</button>
                    <input type="hidden" th:field="*{id}"/>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
