<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8">
    <title>PoorMusic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/index}">PoorMusic</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                    aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" th:href="@{/login}">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" th:href="@{/register}">Register</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <main>

        <section class="py-5 text-center container">
            <div class="row py-lg-5">
                <div class="col-lg-6 col-md-8 mx-auto">
                    <h1 class="fw-light">Collection</h1>
                    <p class="lead text-body-secondary">Something short and leading about the collection below—its contents, the creator, etc. Make it short and sweet, but not too short so folks don’t simply skip over it entirely.</p>
                    <p>
                        <a th:href="@{/addTrackForm}" class="btn btn-primary my-2">Add new track</a>
                    </p>
                </div>
            </div>
        </section>

        <div class="container">
            <ul class="nav nav-tabs">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/playlists}">Playlists</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/albums}">Albums</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/tracks}">Tracks</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/artists}">Artists</a>
                </li>
            </ul>
        </div>

        <div class="d-flex-grow-1 flex-column flex-md-row p-4 gap-4 py-md-3 align-items-center justify-content-center">
            <div class="list-group">
                <div class="list-group-item list-group-item-action d-flex gap-3 py-3" aria-current="true" th:each="track: ${tracks}">
                    <div class="flex-content me-auto">
                        <img src="https://avatars.yandex.net/get-music-content/5576540/6cb4a916.a.21564373-1/50x50" alt="twbs" width="50" height="50" class="rounded-circle flex-shrink-0">
                    </div>
                    <div class="d-flex-grow-2 gap-2 w-100 justify-content-start">
                        <div>
                            <h6 class="mb-0">
                                <a th:href="@{'/track/' + ${track.id}}" th:text="${track.getTitle()}"></a>
                            </h6>
                            <p class="mb-0 opacity-75">
                        <span th:each="artist: ${track.getArtists()}">
                            <a th:href="@{'/artist/' + ${artist.id}}" th:text="${artist.getTitle()}"></a>
                            <span th:if="${!artistStat.last}">, </span>
                        </span>
                            </p>
                        </div>
                    </div>
                    <div class="flex-content ms-auto">
                        <small class="opacity-50 text-nowrap" th:text="${track.getDuration()}"></small>
                    </div>
                </div>
            </div>
        </div>

    </main>
</body>
